name: Deploy Member Hub to GitHub Pages

on:
  # Pull requests are checked too. Without this the gates only ran after a merge,
  # which meant a change was already on main and already deploying by the time
  # anything verified it. A gate that runs after the door is a log, not a gate.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pull request checks and production deploys used to share one group with
# cancel-in-progress, so pushing to any PR branch cancelled a deploy of main that
# was already running. On Sep 22 that cancelled the deploys of #44 and #36 and left
# main undeployed. Deploys of main now have their own group and are never cancelled
# by a PR; a newer push to main still supersedes an older one. Each PR has its own
# group, where a newer push cancelling an older check is what you want.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('check-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # Curriculum integrity and types must pass before anything deploys.
      # These gates exist because content defects reached production before.
      - run: npm test
      - run: npm run build
      # Routing is invisible to the type check and to the build. The Hub had no
      # addresses at all, so Back left the product instead of stepping back through
      # it and no course could be linked to, and nothing above would have noticed.
      # This drives the built output in a real browser, served the way Pages serves
      # it, so it runs after the build rather than with the other gates.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:render:routing
      - run: npm run test:render:guest
      - run: npm run test:render:catalog
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # Only main publishes. A pull request runs the gates and stops there.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
