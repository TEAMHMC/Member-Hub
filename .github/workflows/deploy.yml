name: Deploy Member Hub to GitHub Pages

on:
  # Pull requests are checked too. Without this the gates only ran after a merge,
  # which meant a change was already on main and already deploying by the time
  # anything verified it. A gate that runs after the door is a log, not a gate.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # Curriculum integrity and types must pass before anything deploys.
      # These gates exist because content defects reached production before.
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # Only main publishes. A pull request runs the gates and stops there.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
