<body class="bg-[#f5f3ef] text-slate-900">
  <div id="root"></div>
<!-- Shared HMC button system: one definition of a button across every HMC
     surface. Shape, fill and the dot come from the stylesheet; the script only
     stops a button that ships its own dot from drawing a second one.
     Attribute-only, so it never mutates DOM that React owns.

     Keep the two versions matched. They are published as a pair from the
     Unstoppable repo, which serves them to this surface, and both 1.0.5 files
     are live. A version that has not been published yet 404s and takes the pill,
     the fill and the dot with it, so check that a version resolves before
     bumping to it. -->
<link rel="stylesheet" href="https://unstoppable.healthmatters.clinic/assets/site/hmc-buttons-1.0.5.css">
<script defer src="https://unstoppable.healthmatters.clinic/assets/site/hmc-buttons-1.0.5.js"></script>
<script type="module" src="/index.tsx"></script>
</body>
